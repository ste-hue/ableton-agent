name: Deploy Cloudflare production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Deploy main from the selected main-branch commit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://gettembro.com
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Validate exact source
        run: |
          npm run typecheck
          npm test
          ./node_modules/.bin/wrangler deploy --dry-run --outdir .wrangler-dry-run/tembro-api
          ./node_modules/.bin/wrangler deploy --config redirects/wrangler.jsonc --dry-run --outdir .wrangler-dry-run/chordarium-link

      - name: Deploy tembro-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy

      - name: Smoke-test tembro-api before changing the exact-route shim
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          async function eventually(label, check) {
            let last;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                await check();
                return;
              } catch (error) {
                last = error;
                if (attempt < 12) await sleep(5000);
              }
            }
            throw new Error(`${label}: ${last?.message ?? last}`);
          }

          await eventually("tembro-api smoke test failed", async () => {
            const url =
              `https://gettembro.com/chordarium?utm_source=cloudflare-smoke&ref=${encodeURIComponent(process.env.DEPLOY_SHA)}`;
            const response = await fetch(url, {
              redirect: "manual",
              headers: { "cache-control": "no-cache" },
            });
            const html = await response.text();
            assert(response.status === 200, `expected 200, received ${response.status}`);
            assert(
              (response.headers.get("content-type") ?? "").includes("text/html"),
              "response is not HTML",
            );
            assert(
              html.includes('rel="canonical" href="https://gettembro.com/chordarium"'),
              "new Chordarium storefront was not returned",
            );
            assert(
              html.includes("Try online. Get the complete plug-in."),
              "expected Chordarium product copy is missing",
            );
            assert(html.includes('href="/chordarium/buy"'), "purchase route is missing");
          });
          NODE

      - name: Deploy tembro-chordarium-link
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --config redirects/wrangler.jsonc

      - name: Run production smoke tests
        run: |
          node --input-type=module <<'NODE'
          const base = "https://gettembro.com";
          const checkout =
            "https://tembro.lemonsqueezy.com/checkout/buy/17e4b1a7-187d-4700-adba-cb07b41fb9ed?checkout[discount_code]=LAUNCH59";
          const atlasCheckout =
            "https://tembro.lemonsqueezy.com/checkout/buy/0026137e-70fd-4687-b09d-d3e190142565";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const hit = (path, init = {}) =>
            fetch(base + path, {
              redirect: "manual",
              ...init,
              headers: {
                "cache-control": "no-cache",
                ...(init.headers ?? {}),
              },
            });
          async function eventually(label, check) {
            let last;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                await check();
                return;
              } catch (error) {
                last = error;
                if (attempt < 12) await sleep(5000);
              }
            }
            throw new Error(`${label}: ${last?.message ?? last}`);
          }

          await eventually("production smoke tests failed", async () => {
            const home = await hit("/");
            assert(home.status === 200, `GET /: ${home.status}`);
            const homeHtml = await home.text();
            assert(
              homeHtml.includes('href="/chordarium"') && homeHtml.includes("Chordarium"),
              "storefront does not expose Chordarium",
            );

            const atlas = await hit("/atlas");
            assert(atlas.status === 200, `GET /atlas: ${atlas.status}`);

            const tembro = await hit("/tembro");
            assert(tembro.status === 302, `GET /tembro: ${tembro.status}`);
            assert(new URL(tembro.headers.get("location"), base).href === `${base}/#products`, "retired credit page did not return to products");
            assert(homeHtml.includes('href="/atlas/download"'), "Atlas acquisition link is missing");
            assert(homeHtml.includes('href="/chordarium/buy"'), "Chordarium checkout link is missing");
            assert(!/credits/i.test(homeHtml), "catalog still advertises credits");

            const health = await hit("/v0/health");
            assert(health.status === 200, `GET /v0/health: ${health.status}`);
            assert((await health.json()).ok === true, "health payload is not OK");

            const chordarium = await hit("/chordarium");
            assert(chordarium.status === 200, `GET /chordarium: ${chordarium.status}`);
            assert(
              (await chordarium.text()).includes("Try online. Get the complete plug-in."),
              "bare Chordarium route did not reach the storefront",
            );

            const slash = await hit("/chordarium/?utm_source=cloudflare-smoke");
            assert(slash.status === 308, `GET /chordarium/: ${slash.status}`);
            assert(
              new URL(slash.headers.get("location"), base).href ===
                `${base}/chordarium?utm_source=cloudflare-smoke`,
              `wrong slash redirect: ${slash.headers.get("location")}`,
            );

            const head = await hit("/chordarium", { method: "HEAD" });
            assert(head.status === 200, `HEAD /chordarium: ${head.status}`);
            assert((await head.arrayBuffer()).byteLength === 0, "HEAD returned a body");

            const post = await hit("/chordarium", { method: "POST" });
            assert(post.status === 405, `POST /chordarium: ${post.status}`);
            assert(post.headers.get("allow") === "GET, HEAD", "wrong Allow header");

            const buy = await hit("/chordarium/buy?utm_source=cloudflare-smoke");
            assert(buy.status === 302, `GET /chordarium/buy: ${buy.status}`);
            assert(
              buy.headers.get("location") === checkout,
              `wrong checkout destination: ${buy.headers.get("location")}`,
            );

            const download = await hit("/chordarium/download?utm_source=cloudflare-smoke");
            assert(download.status === 302, `GET /chordarium/download: ${download.status}`);
            const downloadUrl = "https://app.lemonsqueezy.com/my-orders";
            assert(download.headers.get("location") === downloadUrl, "wrong Chordarium download destination");

            const atlasDownload = await hit("/atlas/download");
            assert(atlasDownload.status === 302, `GET /atlas/download: ${atlasDownload.status}`);
            assert(
              atlasDownload.headers.get("location") === atlasCheckout,
              `wrong Atlas destination: ${atlasDownload.headers.get("location")}`,
            );
          });
          NODE
