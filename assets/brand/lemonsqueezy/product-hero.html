<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 80px 110px; display: flex; flex-direction: column; justify-content: space-between; }
  .eclipse { position: absolute; right: 90px; top: 70px; color: var(--sun); opacity: .95; }
  h1 { font-size: 120px; margin-top: 24px; max-width: 1200px; }
  .sub { margin-top: 30px; font-size: 34px; line-height: 1.3; color: var(--paper); max-width: 1180px; }
  .packs { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .card { padding: 34px 44px; }
  .card .name { font-size: 34px; color: var(--night-mid); }
  .card .price { font-size: 92px; margin: 18px 0 10px; }
  .card .cr { font-size: 38px; color: var(--paper); }
  .foot { margin-top: 34px; font-size: 26px; display: flex; justify-content: space-between; }
</style>
